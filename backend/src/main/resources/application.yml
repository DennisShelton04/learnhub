spring:
  application:
    name: learnhub-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/learnhub}
    username: ${DB_USERNAME:learnhub}
    password: ${DB_PASSWORD:learnhub}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  storage:
    local-dir: ${STORAGE_LOCAL_DIR:./uploads}

management:
  endpoints:
    web:
      exposure:
        include: health
